<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BipektimVar | Admin Paneli</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#050c08] text-slate-100 font-['Plus_Jakarta_Sans'] antialiased min-h-screen relative overflow-x-hidden p-4 sm:p-8">

  <!-- Arka Plan Işık Efektleri -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-[128px] pointer-events-none"></div>
  <div class="fixed top-1/3 -right-40 w-96 h-96 bg-emerald-400/10 rounded-full blur-[128px] pointer-events-none"></div>

  <div class="max-w-4xl mx-auto space-y-6 relative z-10">
    
    <!-- Üst Başlık ve Çıkış Butonu -->
    <header class="flex justify-between items-center border-b border-emerald-900/40 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-black font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white flex items-center gap-2">
            Yönetici Paneli
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </h1>
          <p class="text-xs text-slate-400">Canlı Sipariş & Kurye Takip Merkezi</p>
        </div>
      </div>
      <button id="adminLogout" class="hidden text-xs font-semibold bg-rose-950/60 border border-rose-800/50 text-rose-300 px-4 py-2 rounded-xl hover:bg-rose-900 transition-colors">
        Çıkış Yap
      </button>
    </header>

    <!-- Giriş Formu (Oturum Açılmamışsa Görünür) -->
    <div id="adminAuth" class="glass-card p-8 rounded-3xl border border-emerald-900/30 bg-[#0a1610]/70 backdrop-blur-xl shadow-2xl max-w-md mx-auto space-y-6 mt-12">
      <div class="text-center space-y-2">
        <h2 class="text-2xl font-black text-white">Admin Girişi</h2>
        <p class="text-xs text-slate-400">Siparişleri yönetmek için yetkili hesabınızla giriş yapın.</p>
      </div>

      <form id="adminLoginForm" class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">E-Posta Adresi</label>
          <input id="adminEmail" type="email" required placeholder="admin@bipektimvar.com" class="custom-input">
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Şifre</label>
          <input id="adminPassword" type="password" required placeholder="••••••••" class="custom-input">
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-400 to-teal-300 text-black font-extrabold rounded-xl text-sm shadow-lg shadow-emerald-500/10 hover:brightness-110 transition-all">
          Sisteme Giriş Yap
        </button>
      </form>
    </div>

    <!-- Yönetici Kontrol Paneli (Oturum Açıldığında Görünür) -->
    <div id="adminDashboard" class="hidden space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Tüm Sipariş Akışı
        </h2>
      </div>

      <!-- Siparişlerin Anlık Listeleneceği Alan -->
      <div id="adminOrdersList" class="space-y-4">
        <div class="p-8 text-center text-slate-500 text-sm glass-card rounded-2xl border border-emerald-900/30">
          Siparişler yükleniyor...
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
