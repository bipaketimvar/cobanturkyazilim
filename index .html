<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05040b;
}

body{
    overflow-x:hidden;
}

.site{
    position:relative;
    width:100%;
    margin:0;
    padding:0;
    line-height:0;
}

.ana-gorsel{
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
    border:0;
}


/* =========================================
   TÜM GİZLİ TIKLAMA ALANLARI
   ========================================= */

.tiklama{
    position:absolute;
    display:block;

    background:transparent;
    border:0;
    outline:none;

    padding:0;
    margin:0;

    cursor:pointer;
    text-decoration:none;

    z-index:1000;

    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}


/* =========================================
   1 - İLETİŞİME GEÇ
   ========================================= */

.iletisime-gec{
    left:2%;
    top:30%;
    width:25%;
    height:7%;
    z-index:2000;
}


/* =========================================
   2 - TEKNİK DESTEK
   ÜSTTEKİ "Teknik Destek"
   ========================================= */

.teknik-destek-1{
    left:72%;
    top:36%;
    width:28%;
    height:8%;
    z-index:3000;
}


/* =========================================
   3 - TEKNİK DESTEK
   ALTTaki "TEKNİK DESTEK"
   ========================================= */

.teknik-destek-2{
    left:58%;
    top:44%;
    width:41%;
    height:10%;
    z-index:3000;
}


/* =========================================
   4 - HEMEN İLETİŞİME GEÇ
   ========================================= */

.hemen-iletisim{
    left:59%;
    top:75%;
    width:39%;
    height:9%;
    z-index:2000;
}


/* =========================================
   5 - ALT WHATSAPP
   ========================================= */

.alt-whatsapp{
    left:1%;
    top:85%;
    width:32%;
    height:10%;
    z-index:2000;
}


/* =========================================
   6 - ALT TELEFON
   ========================================= */

.alt-telefon{
    left:33%;
    top:85%;
    width:34%;
    height:10%;
    z-index:2000;
}


/* =========================================
   7 - ALT İLETİŞİM / E-POSTA ALANI
   WHATSAPP'A GİDER
   ========================================= */

.alt-email{
    left:67%;
    top:85%;
    width:32%;
    height:10%;
    z-index:2000;
}


/* =========================================
   SABİT WHATSAPP + TELEFON BUTONLARI
   ========================================= */

.sabit-iletisim{
    position:fixed;

    right:14px;
    bottom:16px;

    display:flex;
    flex-direction:column;
    gap:10px;

    z-index:99999;

    line-height:normal;
}


/* =========================================
   SABİT BUTON
   ========================================= */

.sabit-btn{
    width:56px;
    height:56px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    text-decoration:none;

    border:2px solid rgba(255,255,255,.25);

    box-shadow:
        0 5px 20px rgba(0,0,0,.55);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.sabit-btn:hover{
    transform:scale(1.08);
}

.sabit-btn:active{
    transform:scale(.92);
}


/* =========================================
   WHATSAPP BUTONU
   ========================================= */

.sabit-whatsapp{
    background:#25D366;
}


/* =========================================
   TELEFON BUTONU
   ========================================= */

.sabit-telefon{
    background:#6530D7;
}


/* =========================================
   SABİT BUTON İKONLARI
   ========================================= */

.sabit-btn svg{
    width:29px;
    height:29px;
    fill:#fff;
}


/* =========================================
   MOBİL
   ========================================= */

@media(max-width:700px){

    .iletisime-gec{
        left:2%;

        width:26%;

        width:43%;

    .hemen-iletisim{

        width:41%;
        height:9%;
    }

    .alt-whatsapp{

        top:85%;
        width:32%;
        height:10%;
    }

    .alt-telefon{
        left:33%;
        top:85%;
        width:34%;
        height:10%;
    }

    .alt-email{
        left:67%;
        top:85%;
        width:32%;
        height:10%;
    }

    .sabit-iletisim{
        right:11px;
        bottom:12px;
        gap:8px;
    }

    .sabit-btn{
        width:52px;
        height:52px;
    }

    .sabit-btn svg{
        width:27px;
        height:27px;
    }
}


/* =========================================

    .sabit-btn{
        width:50px;
        height:50px;
    }

    .sabit-btn svg{
        width:26px;
        height:26px;
    }
}

</style>
